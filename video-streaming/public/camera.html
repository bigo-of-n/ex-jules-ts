<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Access</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom styles for the Inter font and overall layout */
      body {
        font-family: "Inter", sans-serif;
      }
      /* Ensure video element is responsive */
      video {
        max-width: 100%;
        height: auto;
        border-radius: 0.5rem; /* Rounded corners for video */
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-purple-50 to-indigo-100 min-h-screen flex items-center justify-center p-4"
  >
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
      <h1 class="text-3xl font-bold text-gray-800 mb-6">Camera Access</h1>

      <!-- Div to display the number of cameras found -->
      <div id="cameraInfo" class="mb-4 text-gray-600 text-lg font-medium">
        <!-- This will be populated by JavaScript -->
      </div>

      <!-- Dropdown for selecting camera, hidden by default -->
      <div id="cameraSelectContainer" class="mb-4 hidden">
        <label
          for="cameraSelect"
          class="block text-gray-700 text-sm font-bold mb-2"
          >Select Camera:</label
        >
        <select
          id="cameraSelect"
          class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75"
        >
          <!-- Options will be populated by JavaScript -->
        </select>
      </div>

      <!-- Button to enable the camera -->
      <button
        id="cameraButton"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75"
      >
        Enable Camera
      </button>

      <!-- Video element to display the camera feed -->
      <video
        id="cameraFeed"
        class="mt-8 bg-gray-200 w-full h-64 object-cover hidden"
        autoplay
        playsinline
      ></video>

      <!-- Message display area for permissions or errors -->
      <p id="message" class="mt-4 text-red-600 font-medium hidden"></p>
    </div>

    <!-- Link to the JavaScript file -->
    <script src="script.js"></script>
  </body>
</html>
